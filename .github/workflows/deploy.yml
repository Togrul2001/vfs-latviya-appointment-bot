name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /root/vfs-latviya
            # Serverdə əl ilə edilmiş dəyişikliklər pull konflikti yaratmasın deyə fetch + reset --hard.
            # Data/secret faylları (.env, *.xlsx, telegram_link.json, bot_settings.json, bot_profile_*)
            # .gitignore-dadır — toxunulmur.
            git fetch origin main
            git reset --hard origin/main
            pip3 install -r requirements.txt --break-system-packages
            cd dashboard/server && npm install
            cd ../frontend && npm install && npm run build
            pm2 restart latviya-dashboard
